<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Page</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .btn { 
            display: block; width: 250px; margin: 15px auto; padding: 15px; 
            text-decoration: none; color: white; border-radius: 5px; font-weight: bold; 
        }
        .btn-nettle { background-color: #2ecc71; }
        .btn-website { background-color: #3498db; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>What do you wanna launch?</h1>
        
        <!-- Link 1: Nettleweb -->
        <a href="/nettleweb" class="btn btn-nettle">Nettleweb</a>
        
        <!-- Link 2: Website -->
        <a href="https://ahw101.github.io/new-website" class="btn btn-website">Website</a>
    </div>

</body>
</html>
